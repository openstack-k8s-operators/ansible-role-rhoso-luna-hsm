- name: Prepare Luna HSM secrets
  block:
    - name: Prepare private working directory
      ansible.builtin.include_tasks: prepare_working_dir.yml

    - name: Create working directories
      ansible.builtin.file:
        path: "{{ working_dir }}/certs"
        state: directory
        mode: "0700"

    - name: Get certs, keys and Chrystoki.conf
      no_log: true
      block:
        - name: Get the server CA cert
          ansible.builtin.get_url:
            url: "{{ luna_server_cert_src }}"
            dest: "{{ working_dir }}/certs/{{ server_ca_file }}"
            mode: "0600"

        - name: Get client cert
          ansible.builtin.get_url:
            url: "{{ luna_client_cert_src }}/{{ luna_client_name }}.pem"
            dest: "{{ working_dir }}/certs/"
            mode: "0600"

        - name: Get client key
          ansible.builtin.get_url:
            url: "{{ luna_client_cert_src }}/{{ luna_client_name }}Key.pem"
            dest: "{{ working_dir }}/certs/"
            mode: "0600"

        - name: Get Chrystoki.conf
          ansible.builtin.get_url:
            url: "{{ chrystoki_conf_src }}"
            dest: "{{ working_dir }}/Chrystoki.conf"
            mode: "0600"

    - name: Create the HSM cert secret
      no_log: true
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
        PATH: "{{ oc_dir }}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      ansible.builtin.command:
        cmd: oc apply -f -
        stdin: "{{ lookup('ansible.builtin.template', 'luna_data_secret.yml.j2') }}"

    - name: Create the hsm-login secret
      no_log: true
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
        PATH: "{{ oc_dir }}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      ansible.builtin.command:
        cmd: oc apply -f -
        stdin: "{{ lookup('ansible.builtin.template', 'login_secret.yml.j2') }}"

  always:
    - name: Perform cleanup tasks
      when: cleanup | bool
      block:
        - name: Remove the working directory
          become: true
          ansible.builtin.file:
            path: "{{ working_dir }}"
            state: absent
          when: working_dir | default('') | length > 0
