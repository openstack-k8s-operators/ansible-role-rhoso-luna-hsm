# Ensure working_dir is a caller-owned private directory (mode 0700).
# When unset/empty, allocate a unique tempfile directory to avoid predictable
# /tmp paths and symlink/pre-creation attacks.

- name: Reset per-include allocation flag
  ansible.builtin.set_fact:
    _hsm_prepare_allocated: false

- name: Allocate a private temporary working directory
  when: working_dir | default('') | length == 0
  block:
    - name: Create temporary directory
      ansible.builtin.tempfile:
        state: directory
        prefix: rhoso-luna-hsm-
      register: _hsm_tmpdir

    - name: Record allocated working_dir
      ansible.builtin.set_fact:
        working_dir: "{{ _hsm_tmpdir.path }}"
        _hsm_prepare_allocated: true

- name: Stat working_dir
  ansible.builtin.stat:
    path: "{{ working_dir }}"
  register: _hsm_working_dir_stat

- name: Fail when caller-provided working_dir already exists
  when:
    - not (_hsm_prepare_allocated | bool)
    - _hsm_working_dir_stat.stat.exists | default(false)
  ansible.builtin.fail:
    msg: >-
      working_dir '{{ working_dir }}' already exists. Refusing to reuse a
      pre-existing path (possible symlink or ownership attack). Unset
      working_dir to auto-allocate a private tempfile, or choose a new path.

- name: Ensure private working_dir exists
  ansible.builtin.file:
    path: "{{ working_dir }}"
    state: directory
    mode: "0700"
