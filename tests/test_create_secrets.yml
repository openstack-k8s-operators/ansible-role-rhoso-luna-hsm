---
# Tier-2 create_secrets with fake oc + file:// fixtures (no cluster).
- name: create_secrets with mocked oc
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    working_dir: ""
    cleanup: true
    kubeconfig_path: "{{ playbook_dir }}/fixtures/fake.kubeconfig"
    oc_dir: "{{ playbook_dir }}/bin"
    luna_client_name: barbican
    luna_partition_password: "TEST-PIN-DO-NOT-LEAK"
    luna_server_cert_src: "file://{{ playbook_dir }}/fixtures/certs/CAFile.pem"
    luna_client_cert_src: "file://{{ playbook_dir }}/fixtures/client"
    chrystoki_conf_src: "file://{{ playbook_dir }}/fixtures/Chrystoki.conf"
    server_ca_file: CAFile.pem
    luna_data_secret: barbican-luna-data
    luna_data_secret_namespace: openstack
    login_secret: hsm-login
    login_secret_field: PKCS11Pin
  environment:
    FAKE_OC_LOGDIR: "{{ playbook_dir }}/.fake-oc-log"
  tasks:
    - name: Reset fake-oc log dir
      ansible.builtin.file:
        path: "{{ playbook_dir }}/.fake-oc-log"
        state: absent

    - name: Recreate fake-oc log dir
      ansible.builtin.file:
        path: "{{ playbook_dir }}/.fake-oc-log"
        state: directory
        mode: "0700"

    - name: Ensure fake kubeconfig exists
      ansible.builtin.copy:
        dest: "{{ kubeconfig_path }}"
        mode: "0600"
        content: |
          apiVersion: v1
          kind: Config
          clusters: []
          contexts: []
          users: []

    - name: Run create_secrets via role context
      ansible.builtin.include_role:
        name: rhoso_luna_hsm
        tasks_from: create_secrets

    - name: Collect fake-oc apply artifacts
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/.fake-oc-log"
        patterns: "apply-*.yml"
      register: applies

    - name: Assert two Secret applies happened
      ansible.builtin.assert:
        that:
          - applies.matched == 2

    - name: Assert PIN field present in captured apply stdin
      ansible.builtin.command: grep -l PKCS11Pin {{ playbook_dir }}/.fake-oc-log/apply-1.yml {{ playbook_dir }}/.fake-oc-log/apply-2.yml
      register: pin_files
      changed_when: false

    - name: Assert PIN field found
      ansible.builtin.assert:
        that:
          - pin_files.rc == 0
