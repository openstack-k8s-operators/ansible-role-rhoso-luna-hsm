---
# Tier-3 partial: real oc apply into the caller's project namespace.
# Skips image build (no buildah / no vendor media).
- name: Tier3 real create_secrets (cleanup=false then inspect)
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    working_dir: ""
    cleanup: false
    kubeconfig_path: "{{ lookup('env', 'HOME') }}/.kube/config"
    oc_dir: "{{ lookup('env', 'HOME') }}/bin"
    test_ns: "{{ lookup('pipe', 'oc project -q') }}"
    luna_client_name: barbican
    luna_partition_password: "TIER3-TEST-PIN-DELETE-ME"
    luna_server_cert_src: "file://{{ playbook_dir }}/fixtures/certs/CAFile.pem"
    luna_client_cert_src: "file://{{ playbook_dir }}/fixtures/client"
    chrystoki_conf_src: "file://{{ playbook_dir }}/fixtures/Chrystoki.conf"
    server_ca_file: CAFile.pem
    luna_data_secret: glasswing-luna-data-tier3
    luna_data_secret_namespace: "{{ test_ns }}"
    login_secret: glasswing-hsm-login-tier3
    login_secret_field: PKCS11Pin
  tasks:
    - name: Show target namespace
      ansible.builtin.debug:
        msg: "Applying Secrets to namespace {{ test_ns }}"

    - name: Run create_secrets via role (retain staging)
      ansible.builtin.include_role:
        name: rhoso_luna_hsm
        tasks_from: create_secrets

    - name: Stat staging certs dir
      ansible.builtin.stat:
        path: "{{ working_dir }}/certs"
      register: certs_dir

    - name: Stat client key
      ansible.builtin.stat:
        path: "{{ working_dir }}/certs/{{ luna_client_name }}Key.pem"
      register: key_file

    - name: Assert staging modes
      ansible.builtin.assert:
        that:
          - certs_dir.stat.mode == '0700'
          - key_file.stat.mode == '0600'

    - name: Assert no rendered Secret YAML on disk
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ working_dir }}/login_secret.yml"
        - "{{ working_dir }}/luna_data_secret.yml"
      register: yaml_files

    - name: Assert YAML files absent
      ansible.builtin.assert:
        that:
          - not (item.stat.exists | default(false))
      loop: "{{ yaml_files.results }}"

    - name: Verify Secrets exist in cluster
      ansible.builtin.command: "oc get secret {{ item }} -n {{ test_ns }}"
      loop:
        - "{{ luna_data_secret }}"
        - "{{ login_secret }}"
      changed_when: false

    - name: Cleanup staging dir
      ansible.builtin.file:
        path: "{{ working_dir }}"
        state: absent

    - name: Delete test Secrets from cluster
      ansible.builtin.command: "oc delete secret {{ item }} -n {{ test_ns }} --ignore-not-found"
      loop:
        - "{{ luna_data_secret }}"
        - "{{ login_secret }}"
      changed_when: false
